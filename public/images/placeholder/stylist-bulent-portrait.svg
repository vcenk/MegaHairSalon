<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bülent — Megas Hair Salon, Coquitlam">
  
  <defs>
    <linearGradient id="warmVertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#ECE7DD"/>
      <stop offset="100%" stop-color="#E4DFD5"/>
    </linearGradient>
    <linearGradient id="warmDiagonal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECE7DD"/>
      <stop offset="100%" stop-color="#E4DFD5"/>
    </linearGradient>
    <radialGradient id="softVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(26,26,26,0.20)"/>
    </radialGradient>
    <linearGradient id="inkToAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1C1C"/>
      <stop offset="70%" stop-color="#3D3A36"/>
      <stop offset="100%" stop-color="#8C7043"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1500" fill="url(#inkToAccent)"/>

  <!-- Subtle texture -->
  <g opacity="0.05">
    <rect width="1200" height="1500" fill="url(#warmVertical)"/>
  </g>

  <!-- Large serif initial -->
  <text x="600" y="945" font-family="Georgia, 'Times New Roman', serif" font-size="1275" fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle" font-weight="300">B</text>

  <!-- Bottom brand band -->
  <rect x="0" y="1360" width="1200" height="140" fill="#1C1C1C" opacity="0.7"/>
  <text x="600" y="1418" font-family="Georgia, serif" font-size="50" fill="#FFFFFF" text-anchor="middle" font-weight="500" letter-spacing="-1">Bülent</text>
  <text x="600" y="1464" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#B0925E" text-anchor="middle" letter-spacing="6">35 YEARS · MASTER COLOURIST</text>
</svg>
