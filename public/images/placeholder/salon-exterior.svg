<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Megas Hair Salon exterior on Pacific Street, Coquitlam">
  
  <defs>
    <linearGradient id="warmVertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#ECE7DD"/>
      <stop offset="100%" stop-color="#E4DFD5"/>
    </linearGradient>
    <linearGradient id="warmDiagonal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECE7DD"/>
      <stop offset="100%" stop-color="#E4DFD5"/>
    </linearGradient>
    <radialGradient id="softVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(26,26,26,0.20)"/>
    </radialGradient>
    <linearGradient id="inkToAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1C1C"/>
      <stop offset="70%" stop-color="#3D3A36"/>
      <stop offset="100%" stop-color="#8C7043"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="660" fill="#FFFFFF"/>
  <!-- Building face -->
  <rect x="0" y="180" width="1600" height="840" fill="#ECE7DD"/>
  <!-- Window bank -->
  <rect x="160" y="360" width="1280" height="480" fill="#3D3A36" opacity="0.65"/>
  <!-- Mullions -->
  <g stroke="#E4DFD5" stroke-width="3">
    <line x1="480" y1="360" x2="480" y2="840"/>
    <line x1="800" y1="360" x2="800" y2="840"/>
    <line x1="1120" y1="360" x2="1120" y2="840"/>
  </g>
  <!-- Signage -->
  <rect x="560" y="216" width="480" height="96" fill="#1C1C1C"/>
  <text x="800" y="288" font-family="Georgia, serif" font-size="56" fill="#FFFFFF" text-anchor="middle" font-weight="500" letter-spacing="-1">Megas</text>
  <!-- Door -->
  <rect x="704" y="660" width="192" height="360" fill="#B0925E" opacity="0.85"/>
  <!-- Sidewalk -->
  <rect x="0" y="1020" width="1600" height="180" fill="#E4DFD5"/>
  <rect width="1600" height="1200" fill="url(#softVignette)"/>
</svg>
