<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Gazi — at work at Megas Hair Salon, Coquitlam">
  
  <defs>
    <linearGradient id="warmVertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#ECE7DD"/>
      <stop offset="100%" stop-color="#E4DFD5"/>
    </linearGradient>
    <linearGradient id="warmDiagonal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECE7DD"/>
      <stop offset="100%" stop-color="#E4DFD5"/>
    </linearGradient>
    <radialGradient id="softVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(26,26,26,0.20)"/>
    </radialGradient>
    <linearGradient id="inkToAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1C1C"/>
      <stop offset="70%" stop-color="#3D3A36"/>
      <stop offset="100%" stop-color="#8C7043"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="1200" fill="url(#warmDiagonal)"/>

  <!-- Large arc suggesting a styling chair / scene -->
  <circle cx="630" cy="720" r="420" fill="#E4DFD5" opacity="0.85"/>
  <circle cx="630" cy="672.0000000000001" r="240" fill="#1C1C1C" opacity="0.85"/>

  <!-- Reflection / mirror -->
  <rect x="1080" y="120" width="540" height="660" fill="#FFFFFF" opacity="0.9"/>
  <rect x="1092" y="132" width="516" height="636" fill="#ECE7DD" opacity="0.8"/>

  <!-- Copper accent line -->
  <line x1="0" y1="960" x2="1800" y2="960" stroke="#B0925E" stroke-width="3" opacity="0.7"/>

  <!-- Name tag -->
  <text x="60" y="1130" font-family="Georgia, serif" font-size="64" fill="#1C1C1C" font-weight="500" letter-spacing="-1">Gazi</text>
  <text x="60" y="1174" font-family="Inter, sans-serif" font-size="20" fill="#B0925E" letter-spacing="6">MEGAS · COQUITLAM</text>

  <rect width="1800" height="1200" fill="url(#softVignette)"/>
</svg>
