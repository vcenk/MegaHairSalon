<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Megas Hair Salon — master colourists in Coquitlam since 1984">
  
  <defs>
    <linearGradient id="warmVertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#ECE7DD"/>
      <stop offset="100%" stop-color="#E4DFD5"/>
    </linearGradient>
    <linearGradient id="warmDiagonal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECE7DD"/>
      <stop offset="100%" stop-color="#E4DFD5"/>
    </linearGradient>
    <radialGradient id="softVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(26,26,26,0.20)"/>
    </radialGradient>
    <linearGradient id="inkToAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1C1C"/>
      <stop offset="70%" stop-color="#3D3A36"/>
      <stop offset="100%" stop-color="#8C7043"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#warmVertical)"/>

  <!-- Accent rule -->
  <rect x="0" y="0" width="1200" height="8" fill="#B0925E"/>

  <!-- M watermark -->
  <text x="983.9999999999999" y="535.5" font-family="Georgia, serif" font-size="567" fill="#B0925E" fill-opacity="0.08" text-anchor="middle" font-weight="300">M</text>

  <!-- Brand mark -->
  <text x="72" y="176.4" font-family="Inter, sans-serif" font-size="22" fill="#B0925E" letter-spacing="7">MEGAS · HAIR · SALON</text>

  <text x="72" y="352.8" font-family="Georgia, serif" font-size="76" fill="#1C1C1C" font-weight="500" letter-spacing="-2">Master colourists,</text>
  <text x="72" y="440.8" font-family="Georgia, serif" font-size="76" fill="#1C1C1C" font-weight="500" letter-spacing="-2">since 1984.</text>

  <text x="72" y="579.6" font-family="Inter, sans-serif" font-size="22" fill="#6E6E6E" letter-spacing="3">COQUITLAM · BC · CANADA</text>
</svg>
