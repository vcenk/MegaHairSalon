<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Megas Hair Salon — master colourists in Coquitlam, BC">
  
  <defs>
    <linearGradient id="warmVertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="55%" stop-color="#F2EEE7"/>
      <stop offset="100%" stop-color="#E5DFD5"/>
    </linearGradient>
    <linearGradient id="warmDiagonal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2EEE7"/>
      <stop offset="100%" stop-color="#E5DFD5"/>
    </linearGradient>
    <radialGradient id="softVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(26,26,26,0.20)"/>
    </radialGradient>
    <linearGradient id="inkToAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="70%" stop-color="#3D3A36"/>
      <stop offset="100%" stop-color="#8A5524"/>
    </linearGradient>
  </defs>

  <rect width="2400" height="1600" fill="url(#warmVertical)"/>

  <!-- Soft architectural planes suggesting salon interior -->
  <g opacity="0.55">
    <rect x="0" y="1050" width="2400" height="550" fill="#E5DFD5"/>
    <rect x="1550" y="120" width="620" height="1020" fill="#F2EEE7" opacity="0.75"/>
    <rect x="1580" y="150" width="560" height="960" fill="#FAF8F5" opacity="0.9"/>
    <line x1="1580" y1="1110" x2="2140" y2="1110" stroke="#B87333" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Large M watermark -->
  <text x="1200" y="1250" font-family="Georgia, 'Times New Roman', serif" font-size="1600" fill="#B87333" fill-opacity="0.07" text-anchor="middle" font-weight="300">M</text>

  <!-- Brand mark -->
  <text x="140" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="70" fill="#1A1A1A" font-weight="500" letter-spacing="-2">Megas</text>
  <text x="140" y="200" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#B87333" letter-spacing="6">HAIR · SALON · 1984</text>

  <rect width="2400" height="1600" fill="url(#softVignette)"/>
</svg>
